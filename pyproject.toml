[project]
name = "adk-antigravity-smb-starter-kit"
version = "2.0.0"
description = "Google Cloud SMB Launchpad: 3 Production-Ready ADK 2.0 Agents (Marketing, Front-Desk Triage, Churn & Retention) built with Antigravity (agy), agents-cli, and Gemini Enterprise Agent Platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Google Cloud Agentic Engineering & Architecture" }
]
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=1.10.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-bigquery>=3.27.0",
    "google-cloud-discoveryengine>=0.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
